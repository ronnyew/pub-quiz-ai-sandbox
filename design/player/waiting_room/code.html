<!-- Countdown Simulation Script -->
<script>
  (function initTimer() {
    let secondsLeft = 15;
    const totalSeconds = 30;
    const circumference = 2 * Math.PI * 34; // r=34 -> ~213.6
    const timerDisplay = document.getElementById('timer-display');
    const timerRing = document.getElementById('timer-ring');

    const interval = setInterval(() => {
      if (secondsLeft > 0) {
        secondsLeft--;
        const formatted = secondsLeft < 10 ? '0' + secondsLeft : secondsLeft;
        if (timerDisplay) {
          timerDisplay.textContent = '00:' + formatted;
        }
        
        const progressPercent = (secondsLeft / totalSeconds);
        const offset = circumference * (1 - progressPercent);
        
        if (timerRing) {
          timerRing.style.strokeDashoffset = offset.toString();
        }
      } else {
        clearInterval(interval);
        if (timerDisplay) {
          timerDisplay.textContent = '00:00';
        }
      }
    }, 1000);
  })();
</script>
